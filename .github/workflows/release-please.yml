name: Release Please

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: actions/checkout@v4
        if: steps.release.outputs.pr
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}

      - uses: dtolnay/rust-toolchain@nightly
        if: steps.release.outputs.pr

      - name: Update Cargo.lock
        if: steps.release.outputs.pr
        run: |
          .github/scripts/cargo-fetch-all.sh
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- Cargo.lock
          git commit -m "chore: update Cargo.lock"
          git push

  prepare-assets:
    name: Prepare release assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Download and verify registered artifacts
        env:
          OUTPUT_DIR: artifacts
        run: |
          jq -r '.stateless_validators[] as $validator | $validator.artifacts[] | "\($validator.name) \(.zkvm)"' artifact-registry.json \
            | while read -r name zkvm; do
                bash .github/scripts/fetch-artifacts-for-republish.sh "$name" "$zkvm"
              done

      - name: Generate release notes body
        run: |
          .github/scripts/release-body.py --tag "v$(jq -r '."."' .release-please-manifest.json)" > release-body.md
          cat release-body.md

      - name: Sign artifacts
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            minisign -G -W -p minisign.pub -s minisign.key
          else
            echo "$MINISIGN_SECRET_KEY" > minisign.key
            echo "$MINISIGN_PUBLIC_KEY" > minisign.pub
          fi
          for file in artifacts/*; do
            filename=$(basename "$file")
            echo "$MINISIGN_PASSWORD" | minisign -Sm "$file" -s minisign.key -x "$file.minisig" -t "$filename"
          done
          rm minisign.key

      - name: Verify signatures
        run: |
          for file in artifacts/*.elf artifacts/*.vk; do
            minisign -Vm "$file" -p minisign.pub
          done
          mv minisign.pub artifacts/

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            artifacts
            release-body.md
          if-no-files-found: error

  release-assets:
    name: Update tagged release
    needs: [release-please, prepare-assets]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --repo "${{ github.repository }}" "${{ needs.release-please.outputs.tag_name }}" artifacts/* --clobber

      - name: Append artifact info to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view --repo "${{ github.repository }}" "${{ needs.release-please.outputs.tag_name }}" --json body -q .body > combined-notes.md
          printf '\n\n' >> combined-notes.md
          cat release-body.md >> combined-notes.md
          gh release edit --repo "${{ github.repository }}" "${{ needs.release-please.outputs.tag_name }}" --notes-file combined-notes.md
