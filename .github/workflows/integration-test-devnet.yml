name: Integration test devnet-8

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DEVNET_CATALOG_URL: https://pub-760ad8b3dd9547539f829c1ea30f18b5.r2.dev/devnets/glamsterdam-devnet-8/batches.jsonl

jobs:
  devnet-preflight:
    name: Check devnet-8 catalog and resolve matrix
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.preflight.outputs.available }}
      matrix: ${{ steps.preflight.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Probe batch catalog and build registry matrix
        id: preflight
        env:
          CATALOG_URL: ${{ env.DEVNET_CATALOG_URL }}
        run: bash .github/scripts/devnet-preflight.sh "$CATALOG_URL"

  test-zkvm-execution-devnet:
    name: ${{ matrix.stateless_validator }} on ${{ matrix.zkvm }}
    needs: devnet-preflight
    if: needs.devnet-preflight.outputs.available == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.devnet-preflight.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space
        if: matrix.zkvm == 'zisk'
        run: bash .github/scripts/free-up-disk-space.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.9
        with:
          disable_annotations: true

      - name: Configure sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Run latest devnet-8 blocks
        env:
          ERE_IMAGE_REGISTRY: ghcr.io/eth-act/ere
          RUST_LOG: info,ere_server=error
        run: |
          cargo run --release --package stateless-validator-test --bin zkvm_execution_devnet -- \
            --zkvm ${{ matrix.zkvm }} \
            --stateless-validator ${{ matrix.stateless_validator }} \
            --blocks 100 \
            --output failures.txt
          if [[ -f failures.txt ]]; then
            {
              echo "### ${{ matrix.stateless_validator }} on ${{ matrix.zkvm }}"
              echo '```'
              cat failures.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "${{ matrix.stateless_validator }} on ${{ matrix.zkvm }} was skipped as SDK-incompatible." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show sccache statistics
        run: ${SCCACHE_PATH} --show-stats
