name: Republish Release-Backed Guests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  registry-matrix:
    name: Resolve republish matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build matrix from artifact registry
        id: matrix
        run: |
          MATRIX=$(jq -ce '{ include: [.stateless_validators[] as $validator | $validator.artifacts[] | { stateless_validator: $validator.name, zkvm: .zkvm, zkvm_version: .zkvm_version }] } | select(.include | length > 0)' artifact-registry.json)
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "Matrix: ${MATRIX}"

  republish:
    name: Republish ${{ matrix.stateless_validator }} on ${{ matrix.zkvm }}
    needs: registry-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.registry-matrix.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download and verify registered artifacts
        run: |
          bash .github/scripts/fetch-artifacts-for-republish.sh \
            ${{ matrix.stateless_validator }} \
            ${{ matrix.zkvm }}

      - name: Upload verified artifact pair
        uses: actions/upload-artifact@v4
        with:
          name: stateless-validator-${{ matrix.stateless_validator }}-${{ matrix.zkvm }}-${{ matrix.zkvm_version }}
          path: |
            output/stateless-validator-${{ matrix.stateless_validator }}-${{ matrix.zkvm }}-${{ matrix.zkvm_version }}.elf
            output/stateless-validator-${{ matrix.stateless_validator }}-${{ matrix.zkvm }}-${{ matrix.zkvm_version }}.vk
          if-no-files-found: error

  check-git-tag:
    name: Check whether git tag exists
    needs: republish
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Check whether tag exists
        id: check
        run: |
          TAG=$(git ls-remote --tags "https://github.com/${{ github.repository }}" "v*" \
            | awk '$1 == "${{ github.sha }}" { sub("refs/tags/", "", $2); sub(/\^\{\}$/, "", $2); print $2; exit }')
          echo "exists=$([[ -n "$TAG" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  update-release-with-artifacts:
    name: Update tagged release
    needs: check-git-tag
    if: needs.check-git-tag.outputs.exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all verified artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes body
        run: |
          .github/scripts/release-body.py --tag "${{ needs.check-git-tag.outputs.tag }}" > release-body.md
          cat release-body.md

      - name: Install Minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Sign artifacts
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          echo "$MINISIGN_SECRET_KEY" > minisign.key
          echo "$MINISIGN_PUBLIC_KEY" > minisign.pub
          for file in artifacts/*; do
            filename=$(basename "$file")
            echo "$MINISIGN_PASSWORD" | minisign -Sm "$file" -s minisign.key -x "$file.minisig" -t "$filename"
          done
          mv minisign.pub artifacts/
          rm minisign.key

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --repo "${{ github.repository }}" "${{ needs.check-git-tag.outputs.tag }}" artifacts/* --clobber

      - name: Append artifact info to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view --repo "${{ github.repository }}" "${{ needs.check-git-tag.outputs.tag }}" --json body -q .body > combined-notes.md
          printf '\n\n' >> combined-notes.md
          cat release-body.md >> combined-notes.md
          gh release edit --repo "${{ github.repository }}" "${{ needs.check-git-tag.outputs.tag }}" --notes-file combined-notes.md
