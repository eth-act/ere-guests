name: Compile and Release Compiled Guests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  compile:
    name: Compile stateless-validator-${{ matrix.stateless_validator }}-${{ matrix.zkvm }}
    runs-on: ubuntu-latest
    outputs:
      ere_tag: ${{ steps.get_ere_tag.outputs.ere_tag }}
    strategy:
      fail-fast: false
      matrix:
        stateless_validator:
          - ethrex
          - reth
        zkvm:
          - openvm
          - sp1
          - zisk
        include:
          - stateless_validator: ethrex
            zkvm: zisk
            ere_profile: ethrex
          - stateless_validator: reth
            compiler_args: --ignore-rust-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space
        if: matrix.zkvm == 'zisk'
        run: bash .github/scripts/free-up-disk-space.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get Ere tag
        id: get_ere_tag
        run: |
          ERE_TAG=$(cargo tree -p ere-platform-core | head -n 1 | sed -E -e 's/.*\?rev=(.{7}).*/\1/' -e 's/.*\?tag=v([0-9.]+).*/\1/')
          echo "ere_tag=${ERE_TAG}" >> $GITHUB_OUTPUT
          echo "Ere tag: ${ERE_TAG}"

      - name: Get artifact name
        id: get_artifact_name
        run: |
          ZKVM_VERSION=$(.github/scripts/zkvm-version.sh ${{ matrix.zkvm }})
          ARTIFACT_NAME=stateless-validator-${{ matrix.stateless_validator }}-${{ matrix.zkvm }}-${ZKVM_VERSION}
          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          echo "Artifact name: ${ARTIFACT_NAME}"

      - name: Pull Ere images
        run: |
          docker pull ghcr.io/eth-act/ere/ere-compiler-${{ matrix.zkvm }}:${{ steps.get_ere_tag.outputs.ere_tag }}
          docker pull ghcr.io/eth-act/ere/ere-server-${{ matrix.zkvm }}:${{ steps.get_ere_tag.outputs.ere_tag }}

      - name: Compile guest
        run: |
          docker run \
            ${{ matrix.ere_profile && format('-e ERE_PROFILE={0}', matrix.ere_profile) || '' }} \
            -e OPENVM_RUST_TOOLCHAIN=nightly-2026-01-18 \
            -e RUST_LOG=info \
            -v $PWD:/ere-guests \
            -v $PWD/output:/output \
            ghcr.io/eth-act/ere/ere-compiler-${{ matrix.zkvm }}:${{ steps.get_ere_tag.outputs.ere_tag }} \
            --compiler-kind rust-customized \
            --guest-dir /ere-guests/bin/stateless-validator-${{ matrix.stateless_validator }}/${{ matrix.zkvm }} \
            --output-dir /output \
            --elf-name ${{ steps.get_artifact_name.outputs.artifact_name }}.elf \
            -- \
            ${{ matrix.compiler_args }}

      - name: Compile ZisK guest with feature cycle-scope enabled
        if: ${{ matrix.zkvm == 'zisk' }}
        run: |
          docker run \
            ${{ matrix.ere_profile && format('-e ERE_PROFILE={0}', matrix.ere_profile) || '' }} \
            -e OPENVM_RUST_TOOLCHAIN=nightly-2026-01-18 \
            -e RUST_LOG=info \
            -v $PWD:/ere-guests \
            -v $PWD/output:/output \
            ghcr.io/eth-act/ere/ere-compiler-${{ matrix.zkvm }}:${{ steps.get_ere_tag.outputs.ere_tag }} \
            --compiler-kind rust-customized \
            --guest-dir /ere-guests/bin/stateless-validator-${{ matrix.stateless_validator }}/${{ matrix.zkvm }} \
            --output-dir /output \
            --elf-name ${{ steps.get_artifact_name.outputs.artifact_name }}-profiling.elf \
            -- \
            --features cycle-scope \
            ${{ matrix.compiler_args }}

      - name: Generate program VK
        run: |
          docker run \
            -e RUST_LOG=info \
            -v $PWD/output:/output \
            ghcr.io/eth-act/ere/ere-server-${{ matrix.zkvm }}:${{ steps.get_ere_tag.outputs.ere_tag }} \
            --elf-path /output/${{ steps.get_artifact_name.outputs.artifact_name }}.elf \
            keygen \
            --program-vk-path /output/${{ steps.get_artifact_name.outputs.artifact_name }}.vk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.get_artifact_name.outputs.artifact_name }}
          path: |
            output/${{ steps.get_artifact_name.outputs.artifact_name }}*.elf
            output/${{ steps.get_artifact_name.outputs.artifact_name }}.vk
          if-no-files-found: error

  republish-setup:
    name: Resolve republish matrix from artifact-registry.json
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build matrix from artifact-registry.json
        id: set-matrix
        run: |
          MATRIX=$(jq -c '{ include: [.stateless_validators[] as $sv | $sv.artifacts[] | { stateless_validator: $sv.name, zkvm: .zkvm }] }' artifact-registry.json)
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "Matrix: ${MATRIX}"

  republish:
    name: Republish stateless-validator-${{ matrix.stateless_validator }}-${{ matrix.zkvm }}
    needs: republish-setup
    if: fromJson(needs.republish-setup.outputs.matrix).include[0] != null
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.republish-setup.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space
        if: matrix.zkvm == 'zisk'
        run: bash .github/scripts/free-up-disk-space.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get Ere tag
        id: get_ere_tag
        run: |
          ERE_TAG=$(cargo tree -p ere-platform-core | head -n 1 | sed -E -e 's/.*\?rev=(.{7}).*/\1/' -e 's/.*\?tag=v([0-9.]+).*/\1/')
          echo "ere_tag=${ERE_TAG}" >> $GITHUB_OUTPUT
          echo "Ere tag: ${ERE_TAG}"

      - name: Get artifact name
        id: get_artifact_name
        run: |
          ZKVM_VERSION=$(.github/scripts/zkvm-version.sh ${{ matrix.zkvm }})
          ARTIFACT_NAME=stateless-validator-${{ matrix.stateless_validator }}-${{ matrix.zkvm }}-${ZKVM_VERSION}
          echo "zkvm_version=${ZKVM_VERSION}" >> $GITHUB_OUTPUT
          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          echo "Artifact name: ${ARTIFACT_NAME}"

      - name: Pull Ere images
        run: |
          docker pull ghcr.io/eth-act/ere/ere-server-${{ matrix.zkvm }}:${{ steps.get_ere_tag.outputs.ere_tag }}

      - name: Download artifacts
        run: |
          bash .github/scripts/fetch-artifacts-for-republish.sh \
            ${{ matrix.stateless_validator }} \
            ${{ matrix.zkvm }} \
            ${{ steps.get_artifact_name.outputs.zkvm_version }}

      - name: Generate program VK when unpublished
        run: |
          VK=output/${{ steps.get_artifact_name.outputs.artifact_name }}.vk
          if [[ -f $VK ]]; then
            echo "Republishing the VK listed in artifact-registry.json"
            exit 0
          fi
          docker run \
            -e RUST_LOG=info \
            -v $PWD/output:/output \
            ghcr.io/eth-act/ere/ere-server-${{ matrix.zkvm }}:${{ steps.get_ere_tag.outputs.ere_tag }} \
            --elf-path /output/${{ steps.get_artifact_name.outputs.artifact_name }}.elf \
            keygen \
            --program-vk-path /output/${{ steps.get_artifact_name.outputs.artifact_name }}.vk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.get_artifact_name.outputs.artifact_name }}
          path: |
            output/${{ steps.get_artifact_name.outputs.artifact_name }}*.elf
            output/${{ steps.get_artifact_name.outputs.artifact_name }}.vk
          if-no-files-found: error

  check-git-tag:
    name: Check whether git tag exists
    needs: [compile, republish]
    if: >-
      ${{ !cancelled()
          && needs.compile.result == 'success'
          && (needs.republish.result == 'success' || needs.republish.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check-git-tag.outputs.exists }}
      tag: ${{ steps.check-git-tag.outputs.tag }}
    steps:
      - name: Check whether tag exists
        id: check-git-tag
        run: |
          TAG=$(git ls-remote --tags "https://github.com/${{ github.repository }}" "v*" \
            | awk '$1 == "${{ github.sha }}" { sub("refs/tags/", "", $2); sub(/\^\{\}$/, "", $2); print $2; exit }')
          echo "exists=$([[ -n "$TAG" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  update-release-with-artifacts:
    name: Update release with artifacts
    needs: check-git-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Generate release notes body
        run: |
          .github/scripts/release-body.py --tag "${{ needs.check-git-tag.outputs.tag }}" > release-body.md
          cat release-body.md

      - name: Install Minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Sign Artifacts
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          # Create key files from secrets
          echo "$MINISIGN_SECRET_KEY" > minisign.key
          echo "$MINISIGN_PUBLIC_KEY" > minisign.pub

          echo "Starting signing process..."

          # Iterate over artifacts and sign them
          for file in artifacts/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "Signing $filename..."

              # -S: Sign, -m: file, -s: secret key, -x: output signature, -t: trusted comment
              # We output the .minisig directly into the artifacts folder so it gets released
              echo "$MINISIGN_PASSWORD" | minisign -Sm "$file" -s minisign.key -x "$file.minisig" -t "$filename"
            fi
          done

          # Move the public key into artifacts so it is included in the release
          cp minisign.pub artifacts/

          # Cleanup secret key
          rm minisign.key

          echo "Signing complete. Contents of artifacts:"
          ls -R artifacts

      - name: Upload artifacts to release
        if: needs.check-git-tag.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --repo "${{ github.repository }}" "${{ needs.check-git-tag.outputs.tag }}" artifacts/* --clobber

      - name: Append artifact info to release notes
        if: needs.check-git-tag.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view --repo "${{ github.repository }}" "${{ needs.check-git-tag.outputs.tag }}" --json body -q .body > combined-notes.md
          printf '\n\n' >> combined-notes.md
          cat release-body.md >> combined-notes.md
          gh release edit --repo "${{ github.repository }}" "${{ needs.check-git-tag.outputs.tag }}" --notes-file combined-notes.md
