[workspace]
members = [
    "crates/stateless-validator-debug",
    "crates/stateless-validator-common",
    "crates/stateless-validator-ethrex",
    "crates/stateless-validator-reth",
    "crates/stateless-validator-test",

    # Utils
    "crates/downloader",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.93"
version = "0.13.0"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unnameable_types = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(zisk_hints)',
    'cfg(zisk_hints_debug)',
    'cfg(target_vendor, values("zisk"))',
] }

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
result_large_err = "allow"

[workspace.dependencies]
anyhow = { version = "1.0", default-features = false }
clap = { version = "4.6.0", features = ["derive"] }
const-hex = { version = "1.19", default-features = false }
hex-literal = { version = "1.1.0", default-features = false }
once_cell = { version = "1.21", default-features = false }
serde = { version = "1.0", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
thiserror = { version = "2.0", default-features = false }

# test/util
dashmap = "6.2"
flate2 = "1.1.5"
paste = "1.0"
rayon = "1.11.0"
reqwest = "0.12"
serde_json = "1.0"
tar = "0.4.44"
tempfile = "3.6.0"
tokio = "1"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
walkdir = "2.5.0"
zstd = "0.13.3"

# alloy
alloy-consensus = { version = "2.1.1", default-features = false }
alloy-eips = { version = "2.1.1", default-features = false }
alloy-genesis = { version = "2.1.1", default-features = false }
alloy-primitives = { version = "1.6.0", default-features = false }
alloy-rpc-types-engine = { version = "2.1.1", default-features = false }

# revm
revm = { version = "41.0.0", default-features = false }

# reth
# FIXME: Switch back to a released tag once glamsterdam-devnet-7 lands upstream and zkVM compiler verison is bumped to 1.95.
reth-chainspec = { git = "https://github.com/han0110/reth", rev = "c5dff62a8804b207659f5d1f30f13e66c3a66d4b", default-features = false }
reth-ethereum-primitives = { git = "https://github.com/han0110/reth", rev = "c5dff62a8804b207659f5d1f30f13e66c3a66d4b", default-features = false }
reth-evm-ethereum = { git = "https://github.com/han0110/reth", rev = "c5dff62a8804b207659f5d1f30f13e66c3a66d4b", default-features = false }
reth-payload-validator = { git = "https://github.com/han0110/reth", rev = "c5dff62a8804b207659f5d1f30f13e66c3a66d4b", default-features = false }
reth-primitives-traits = { version = "0.5.2", default-features = false }
reth-stateless = { git = "https://github.com/han0110/stateless", rev = "711c3f91a41e656c1f0aaecd70b62c1bc8df2d06", default-features = false, package = "stateless" }
reth-tries = { git = "https://github.com/han0110/stateless", rev = "711c3f91a41e656c1f0aaecd70b62c1bc8df2d06", default-features = false, package = "tries" }

# ethrex
ethrex-common = { git = "https://github.com/lambdaclass/ethrex.git", rev = "8dcb46e305b0309d4b32a4644fd22a1c1bb73b86", default-features = false }
ethrex-crypto = { git = "https://github.com/lambdaclass/ethrex.git", rev = "8dcb46e305b0309d4b32a4644fd22a1c1bb73b86", default-features = false }
ethrex-guest-program = { git = "https://github.com/lambdaclass/ethrex.git", rev = "8dcb46e305b0309d4b32a4644fd22a1c1bb73b86", default-features = false }

# ssz
libssz = { version = "0.2.2", default-features = false, features = ["alloc"] }
libssz-derive = { version = "0.2.2" }
libssz-merkle = { version = "0.2.2", default-features = false, features = ["alloc"] }
libssz-types = { version = "0.2.2", default-features = false, features = ["alloc"] }

# openvm

openvm-ecc-guest = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.0-rc.3" }
openvm-sha2 = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.0-rc.3" }
openvm-pairing = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.0-rc.3" }
openvm-k256 = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.0-rc.3", package = "k256" }
openvm-p256 = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.0-rc.3", package = "p256" }
openvm-keccak256 = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.0-rc.3" }
openvm-curve-utils = { git = "https://github.com/axiom-crypto/openvm-eth", branch = "develop-v2.0.0-rc.3" }
openvm-kzg = { git = "https://github.com/axiom-crypto/openvm-eth", branch = "develop-v2.0.0-rc.3" }
bls12_381 = { git = "https://github.com/zkcrypto/bls12_381", rev = "6bb96951d5c2035caf4989b6e4a018435379590f", default-features = false }

# zkvm-standard
zkvm-interface = { git = "https://github.com/eth-act/zkvm-standards", rev = "282cd356c3a0498416bb0619f9c8a347ce9933fb" }

# ere
ere-dockerized = { git = "https://github.com/eth-act/ere", tag = "v0.13.0" }
ere-platform-core = { git = "https://github.com/eth-act/ere", tag = "v0.13.0" }
ere-util-build = { git = "https://github.com/eth-act/ere", tag = "v0.13.0" }

# local
stateless-validator-common = { path = "crates/stateless-validator-common", default-features = false }
stateless-validator-debug = { path = "crates/stateless-validator-debug", default-features = false }
stateless-validator-ethrex = { path = "crates/stateless-validator-ethrex", default-features = false }
stateless-validator-reth = { path = "crates/stateless-validator-reth", default-features = false }
stateless-validator-test = { path = "crates/stateless-validator-test", default-features = false }

