[workspace]
members = [
    "crates/stateless-validator-debug",
    "crates/stateless-validator-common",
    "crates/stateless-validator-ethrex",
    "crates/stateless-validator-reth",
    "crates/stateless-validator-test",

    # Utils
    "crates/downloader",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
version = "0.12.1"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unnameable_types = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(zisk_hints)',
    'cfg(zisk_hints_debug)',
    'cfg(target_vendor, values("zisk"))',
] }

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
result_large_err = "allow"

[workspace.dependencies]
anyhow = { version = "1.0", default-features = false }
clap = { version = "4.6.0", features = ["derive"] }
hex-literal = { version = "1.1.0", default-features = false }
once_cell = { version = "1.21", default-features = false }
serde = { version = "1.0", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
thiserror = { version = "2.0", default-features = false }

# test/util
flate2 = "1.1.5"
rayon = "1.11.0"
reqwest = "0.12"
serde_json = "1.0"
tar = "0.4.44"
tempfile = "3.6.0"
tokio = "1"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
walkdir = "2.5.0"
zstd = "0.13.3"

# alloy
alloy-consensus = { version = "2.0.0", default-features = false }
alloy-eips = { version = "2.0.0", default-features = false }
alloy-genesis = { version = "2.0.0", default-features = false, features = [
    "serde-bincode-compat",
] }
alloy-rpc-types-engine = { version = "2.0.0", default-features = false }
alloy-primitives = { version = "1.5.6", default-features = false, features = [
    "map-foldhash",
    "map-indexmap",
] }
alloy-rlp = { version = "0.3", default-features = false }

# revm
revm = { version = "38.0.0", default-features = false }

# reth
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-7", default-features = false }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-7", default-features = false }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-7", default-features = false }
reth-primitives-traits = { version = "0.3.0", default-features = false }
reth-payload-validator = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-7", default-features = false }
reth-stateless = { git = "https://github.com/han0110/stateless", branch = "bal-devnet-7", default-features = false, package = "stateless" }
reth-tries = { git = "https://github.com/han0110/stateless", branch = "bal-devnet-7", default-features = false, package = "tries" }

# ethrex
ethrex-common = { git = "https://github.com/han0110/ethrex.git", branch = "perf/eip8025-witness-dedup", default-features = false }
ethrex-crypto = { git = "https://github.com/han0110/ethrex.git", branch = "perf/eip8025-witness-dedup", default-features = false }
ethrex-guest-program = { git = "https://github.com/han0110/ethrex.git", branch = "perf/eip8025-witness-dedup", default-features = false }

# ssz
libssz = { version = "0.2.2", default-features = false, features = ["alloc"] }
libssz-derive = { version = "0.2.2" }
libssz-merkle = { version = "0.2.2", default-features = false, features = ["alloc"] }
libssz-types = { version = "0.2.2", default-features = false, features = ["alloc"] }

# zkvm-standard
zkvm-interface = { git = "https://github.com/eth-act/zkvm-standards", rev = "282cd356c3a0498416bb0619f9c8a347ce9933fb" }

# ere
ere-platform-core = { git = "https://github.com/eth-act/ere", tag = "v0.12.2" }
ere-dockerized = { git = "https://github.com/eth-act/ere", tag = "v0.12.2" }
ere-util-build = { git = "https://github.com/eth-act/ere", tag = "v0.12.2" }

# local
stateless-validator-common = { path = "crates/stateless-validator-common", default-features = false }
stateless-validator-debug = { path = "crates/stateless-validator-debug", default-features = false }
stateless-validator-ethrex = { path = "crates/stateless-validator-ethrex", default-features = false }
stateless-validator-reth = { path = "crates/stateless-validator-reth", default-features = false }
stateless-validator-test = { path = "crates/stateless-validator-test", default-features = false }

# reth bal-devnet-7
[patch.crates-io]
revm = { git = "https://github.com/bluealloy/revm", rev = "9ccf9e5800e7308f0a591c0493ae8e0de35317f8" }
revm-bytecode = { git = "https://github.com/bluealloy/revm", rev = "9ccf9e5800e7308f0a591c0493ae8e0de35317f8" }
