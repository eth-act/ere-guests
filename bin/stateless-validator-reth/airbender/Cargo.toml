[workspace]

[package]
name = "stateless-validator-reth-airbender"
version = "0.1.0"
edition = "2024"

[dependencies]
# enable features
alloy-primitives = { version = "1.6.0", default-features = false, features = [
    "map-foldhash",
    "sha3-keccak",
] }
revm = { version = "40.0.3", default-features = false, features = ["bn"] }

# ere
ere-platform-airbender = { git = "https://github.com/eth-act/ere", rev = "cb148727f0a0606f16e91106b7fba9b7a462ef04", features = [
    "std",
] }

# local
stateless-validator-reth = { path = "../../../crates/stateless-validator-reth", default-features = false }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
