[workspace]

[package]
name = "stateless-validator-reth-openvm"
version = "0.1.0"
edition = "2024"

[dependencies]
# enable features
alloy-consensus = { version = "2.2.0", default-features = false, features = [
    "crypto-backend",
] }
alloy-primitives = { version = "1.6.1", default-features = false, features = [
    "map-hashbrown",
    "native-keccak",
] }

# revm
revm = { version = "42.0.1", default-features = false }

# openvm
openvm = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0-preview", features = [
    "std",
] }
openvm-algebra-guest = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0-preview" }
openvm-ecc-guest = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0-preview" }
openvm-sha2 = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0-preview" }
openvm-pairing = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0-preview", features = [
    "bn254",
    "bls12_381",
] }
openvm-k256 = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0-preview", package = "k256" }
openvm-p256 = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0-preview", package = "p256" }
openvm-keccak256 = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0-preview" }
openvm-curve-utils = { git = "https://github.com/axiom-crypto/openvm-eth", rev = "e61e82d6645637317efe106ae90bc740043ff81c" }
openvm-kzg = { git = "https://github.com/axiom-crypto/openvm-eth", rev = "e61e82d6645637317efe106ae90bc740043ff81c" }
aurora-engine-modexp = { version = "1.2.0", default-features = false }

# ere
ere-platform-openvm = { git = "https://github.com/eth-act/ere", rev = "6bc7dfc4a02e7c82ca9667a9bd6b7c4723900a6b", features = [
    "std",
] }

# local
stateless-validator-reth = { path = "../../../crates/stateless-validator-reth", features = ["openvm"] }

[patch."https://github.com/openvm-org/openvm.git"]
openvm = { git = "https://github.com/openvm-org//openvm.git", tag = "v2.1.0-preview" }
openvm-algebra-complex-macros = { git = "https://github.com/openvm-org//openvm.git", tag = "v2.1.0-preview" }
openvm-algebra-guest = { git = "https://github.com/openvm-org//openvm.git", tag = "v2.1.0-preview" }
openvm-algebra-moduli-macros = { git = "https://github.com/openvm-org//openvm.git", tag = "v2.1.0-preview" }
openvm-custom-insn = { git = "https://github.com/openvm-org//openvm.git", tag = "v2.1.0-preview" }
openvm-ecc-guest = { git = "https://github.com/openvm-org//openvm.git", tag = "v2.1.0-preview" }
openvm-ecc-sw-macros = { git = "https://github.com/openvm-org//openvm.git", tag = "v2.1.0-preview" }
openvm-k256 = { git = "https://github.com/openvm-org//openvm.git", tag = "v2.1.0-preview", package = "k256" }
openvm-keccak256 = { git = "https://github.com/openvm-org//openvm.git", tag = "v2.1.0-preview" }
openvm-keccak256-guest = { git = "https://github.com/openvm-org//openvm.git", tag = "v2.1.0-preview" }
openvm-macros-common = { git = "https://github.com/openvm-org//openvm.git", tag = "v2.1.0-preview" }
openvm-p256 = { git = "https://github.com/openvm-org//openvm.git", tag = "v2.1.0-preview", package = "p256" }
openvm-pairing = { git = "https://github.com/openvm-org//openvm.git", tag = "v2.1.0-preview" }
openvm-pairing-guest = { git = "https://github.com/openvm-org//openvm.git", tag = "v2.1.0-preview" }
openvm-platform = { git = "https://github.com/openvm-org//openvm.git", tag = "v2.1.0-preview" }
openvm-riscv-guest = { git = "https://github.com/openvm-org//openvm.git", tag = "v2.1.0-preview" }
openvm-sha2 = { git = "https://github.com/openvm-org//openvm.git", tag = "v2.1.0-preview" }
openvm-sha2-guest = { git = "https://github.com/openvm-org//openvm.git", tag = "v2.1.0-preview" }

[profile.release]
codegen-units = 1
lto = "fat"

