[workspace]

[package]
name = "stateless-validator-reth-openvm"
version = "0.1.0"
edition = "2024"

[dependencies]
# enable features
alloy-consensus = { version = "2.0.0", default-features = false, features = [
    "crypto-backend",
] }
alloy-primitives = { version = "1.5.0", default-features = false, features = [
    "map-hashbrown",
    "native-keccak",
] }

# revm
revm = { version = "38.0.0", default-features = false }

# openvm
openvm = { git = "https://github.com/openvm-org/openvm.git", tag = "v1.4.3", features = [
    "std",
] }
openvm-algebra-guest = { git = "https://github.com/openvm-org/openvm.git", tag = "v1.4.3" }
openvm-ecc-guest = { git = "https://github.com/openvm-org/openvm.git", tag = "v1.4.3" }
openvm-sha2 = { git = "https://github.com/openvm-org/openvm.git", tag = "v1.4.3" }
openvm-pairing = { git = "https://github.com/openvm-org/openvm.git", tag = "v1.4.3", features = [
    "bn254",
    "bls12_381",
] }
openvm-k256 = { git = "https://github.com/openvm-org/openvm.git", tag = "v1.4.3", package = "k256" }
openvm-p256 = { git = "https://github.com/openvm-org/openvm.git", tag = "v1.4.3", package = "p256" }
openvm-kzg = { git = "https://github.com/axiom-crypto/openvm-kzg.git", rev = "530a6ed413def5296b7e4967650ba4fc8fd92ea1", default-features = false, features = [
    "use-intrinsics",
] }
openvm-keccak256 = { git = "https://github.com/openvm-org/openvm.git", tag = "v1.4.3" }
aurora-engine-modexp = { version = "1.2.0", default-features = false }

# ere
ere-platform-openvm = { git = "https://github.com/eth-act/ere", tag = "v0.12.2", features = [
    "std",
] }

# local
stateless-validator-reth = { path = "../../../crates/stateless-validator-reth", features = ["openvm"] }

[patch."https://github.com/openvm-org/openvm.git"]
openvm = { git = "https://github.com/openvm-org//openvm.git", tag = "v1.4.3" }
openvm-algebra-complex-macros = { git = "https://github.com/openvm-org//openvm.git", tag = "v1.4.3" }
openvm-algebra-guest = { git = "https://github.com/openvm-org//openvm.git", tag = "v1.4.3" }
openvm-algebra-moduli-macros = { git = "https://github.com/openvm-org//openvm.git", tag = "v1.4.3" }
openvm-custom-insn = { git = "https://github.com/openvm-org//openvm.git", tag = "v1.4.3" }
openvm-ecc-guest = { git = "https://github.com/openvm-org//openvm.git", tag = "v1.4.3" }
openvm-ecc-sw-macros = { git = "https://github.com/openvm-org//openvm.git", tag = "v1.4.3" }
openvm-k256 = { git = "https://github.com/openvm-org//openvm.git", tag = "v1.4.3", package = "k256" }
openvm-keccak256 = { git = "https://github.com/openvm-org//openvm.git", tag = "v1.4.3" }
openvm-keccak256-guest = { git = "https://github.com/openvm-org//openvm.git", tag = "v1.4.3" }
openvm-macros-common = { git = "https://github.com/openvm-org//openvm.git", tag = "v1.4.3" }
openvm-p256 = { git = "https://github.com/openvm-org//openvm.git", tag = "v1.4.3", package = "p256" }
openvm-pairing = { git = "https://github.com/openvm-org//openvm.git", tag = "v1.4.3" }
openvm-pairing-guest = { git = "https://github.com/openvm-org//openvm.git", tag = "v1.4.3" }
openvm-platform = { git = "https://github.com/openvm-org//openvm.git", tag = "v1.4.3" }
openvm-rv32im-guest = { git = "https://github.com/openvm-org//openvm.git", tag = "v1.4.3" }
openvm-sha2 = { git = "https://github.com/openvm-org//openvm.git", tag = "v1.4.3" }
openvm-sha256-guest = { git = "https://github.com/openvm-org//openvm.git", tag = "v1.4.3" }

# reth bal-devnet-7
[patch.crates-io]
revm = { git = "https://github.com/bluealloy/revm", rev = "9ccf9e5800e7308f0a591c0493ae8e0de35317f8" }
revm-bytecode = { git = "https://github.com/bluealloy/revm", rev = "9ccf9e5800e7308f0a591c0493ae8e0de35317f8" }
revm-context = { git = "https://github.com/bluealloy/revm", rev = "9ccf9e5800e7308f0a591c0493ae8e0de35317f8" }
revm-context-interface = { git = "https://github.com/bluealloy/revm", rev = "9ccf9e5800e7308f0a591c0493ae8e0de35317f8" }
revm-database = { git = "https://github.com/bluealloy/revm", rev = "9ccf9e5800e7308f0a591c0493ae8e0de35317f8" }
revm-database-interface = { git = "https://github.com/bluealloy/revm", rev = "9ccf9e5800e7308f0a591c0493ae8e0de35317f8" }
revm-handler = { git = "https://github.com/bluealloy/revm", rev = "9ccf9e5800e7308f0a591c0493ae8e0de35317f8" }
revm-inspector = { git = "https://github.com/bluealloy/revm", rev = "9ccf9e5800e7308f0a591c0493ae8e0de35317f8" }
revm-interpreter = { git = "https://github.com/bluealloy/revm", rev = "9ccf9e5800e7308f0a591c0493ae8e0de35317f8" }
revm-precompile = { git = "https://github.com/bluealloy/revm", rev = "9ccf9e5800e7308f0a591c0493ae8e0de35317f8" }
revm-primitives = { git = "https://github.com/bluealloy/revm", rev = "9ccf9e5800e7308f0a591c0493ae8e0de35317f8" }
revm-state = { git = "https://github.com/bluealloy/revm", rev = "9ccf9e5800e7308f0a591c0493ae8e0de35317f8" }
alloy-evm = { git = "https://github.com/alloy-rs/evm", rev = "5b511acf021fd6f6bd6d52a1e98007af3bf07dd6" }
reth-codecs = { git = "https://github.com/paradigmxyz/reth-core", rev = "032288088069e7e6378f8d4bbac0124db98a77f1" }
reth-codecs-derive = { git = "https://github.com/paradigmxyz/reth-core", rev = "032288088069e7e6378f8d4bbac0124db98a77f1" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth-core", rev = "032288088069e7e6378f8d4bbac0124db98a77f1" }
reth-zstd-compressors = { git = "https://github.com/paradigmxyz/reth-core", rev = "032288088069e7e6378f8d4bbac0124db98a77f1" }

[profile.release]
codegen-units = 1
lto = "fat"
