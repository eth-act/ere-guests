[workspace]

[package]
name = "stateless-validator-reth-sp1"
version = "0.1.0"
edition = "2024"

[dependencies]
# enable features
alloy-primitives = { version = "1.6.0", default-features = false, features = [
    "map-foldhash",
    "sha3-keccak",
] }
revm = { version = "40.0.3", default-features = false, features = ["bn"] }

# crypto backend
kzg-rs = "0.2.8"

# ere
ere-platform-sp1 = { git = "https://github.com/eth-act/ere", rev = "968d72e1ca55e8744ff3517460f0bbd3ee88bd4b" }

# local
stateless-validator-reth = { path = "../../../crates/stateless-validator-reth", features = [
    "sp1",
] }

[patch.crates-io]
sp1-lib = { git = "https://github.com/han0110/sp1", rev = "8564a70ea1952826fc0926eba5a3ce62af53ffac" }

[patch."https://github.com/succinctlabs/sp1.git"]
sp1-lib = { git = "https://github.com/han0110/sp1", rev = "8564a70ea1952826fc0926eba5a3ce62af53ffac" }
sp1-primitives = { git = "https://github.com/han0110/sp1", rev = "8564a70ea1952826fc0926eba5a3ce62af53ffac" }
sp1-zkvm = { git = "https://github.com/han0110/sp1", rev = "8564a70ea1952826fc0926eba5a3ce62af53ffac" }
sp1-libzkevm = { git = "https://github.com/han0110/sp1", rev = "8564a70ea1952826fc0926eba5a3ce62af53ffac", package = "libzkevm" }

[profile.release]
codegen-units = 1
lto = "fat"
