[workspace]

[package]
name = "stateless-validator-reth-risc0"
version = "0.1.0"
edition = "2024"

[dependencies]
# enable features
alloy-primitives = { version = "1.5.0", default-features = false, features = [
    "map-foldhash",
    "tiny-keccak",
] }
revm = { git = "https://github.com/bluealloy/revm", rev = "30e1c40", default-features = false, features = [
    "std",
    "c-kzg",
    "blst",
    "bn",
] }

# ere
ere-platform-risc0 = { git = "https://github.com/eth-act/ere", tag = "v0.6.0", features = [
    "std",
    "unstable",
    "getrandom",
    "sys-getenv",
] }

# local
stateless-validator-reth = { path = "../../../crates/stateless-validator-reth" }

[patch.crates-io]
blst = { git = "https://github.com/risc0/blst", tag = "v0.3.15-risczero.1" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.9-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1" }
p256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "p256/v0.13.2-risczero.1" }
substrate-bn = { git = "https://github.com/risc0/paritytech-bn", tag = "v0.6.0-risczero.0" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
c-kzg = { git = "https://github.com/risc0/c-kzg-4844", tag = "v2.1.5-risczero.0" }
revm = { git = "https://github.com/bluealloy/revm", rev = "30e1c40" }
revm-bytecode = { git = "https://github.com/bluealloy/revm", rev = "30e1c40" }
revm-context = { git = "https://github.com/bluealloy/revm", rev = "30e1c40" }
revm-context-interface = { git = "https://github.com/bluealloy/revm", rev = "30e1c40" }
revm-database = { git = "https://github.com/bluealloy/revm", rev = "30e1c40" }
revm-database-interface = { git = "https://github.com/bluealloy/revm", rev = "30e1c40" }
revm-handler = { git = "https://github.com/bluealloy/revm", rev = "30e1c40" }
revm-inspector = { git = "https://github.com/bluealloy/revm", rev = "30e1c40" }
revm-interpreter = { git = "https://github.com/bluealloy/revm", rev = "30e1c40" }
revm-precompile = { git = "https://github.com/bluealloy/revm", rev = "30e1c40" }
revm-primitives = { git = "https://github.com/bluealloy/revm", rev = "30e1c40" }
revm-state = { git = "https://github.com/bluealloy/revm", rev = "30e1c40" }
alloy-evm = { git = "https://github.com/alloy-rs/evm", branch = "bal-devnet3" }

[patch."https://github.com/paradigmxyz/stateless"]
stateless = { git = "https://github.com/jsign/stateless", rev = "719303c8ca810bf70b19eb9989dc0adb53788d57" }
tries = { git = "https://github.com/jsign/stateless", rev = "719303c8ca810bf70b19eb9989dc0adb53788d57" }
zeth-mpt = { git = "https://github.com/jsign/stateless", rev = "719303c8ca810bf70b19eb9989dc0adb53788d57" }

[profile.release]
codegen-units = 1
lto = "fat"
