[workspace]

[package]
name = "stateless-validator-ethrex-openvm"
edition = "2024"
version = "0.1.0"

[dependencies]
# ere
ere-platform-openvm = { git = "https://github.com/eth-act/ere", rev = "8295d94b4598ef14e6c35fff3dd4935f60f2f7ff", features = [
    "std",
    "zkvm-accelerator",
] }

# local
stateless-validator-ethrex = { path = "../../../crates/stateless-validator-ethrex", features = [
    "std",
    "openvm",
] }

[profile.release]
codegen-units = 1
lto = "fat"
