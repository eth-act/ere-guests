[workspace]

[package]
name = "stateless-validator-ethrex-openvm"
edition = "2024"
version = "0.1.0"

[dependencies]
# ere
ere-platform-openvm = { git = "https://github.com/eth-act/ere", rev = "153b092064a11e4c9c031a89940cbb232c98d59d", features = [
    "std",
    "zkvm-accelerator",
] }

# local
stateless-validator-ethrex = { path = "../../../crates/stateless-validator-ethrex", features = [
    "std",
    "openvm",
] }

[profile.release]
codegen-units = 1
lto = "fat"
