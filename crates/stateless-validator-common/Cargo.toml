[package]
name = "stateless-validator-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true, optional = true }
const-hex = { workspace = true, features = ["alloc"] }
sha2.workspace = true
thiserror.workspace = true

# ssz
libssz.workspace = true
libssz-derive.workspace = true
libssz-merkle = { workspace = true, features = ["sha2-backend"] }
libssz-types.workspace = true

# alloy
alloy-consensus = { workspace = true, optional = true }
alloy-eips = { workspace = true, optional = true }
alloy-genesis = { workspace = true, optional = true }
alloy-primitives = { workspace = true, optional = true }
alloy-rpc-types-debug = { workspace = true, optional = true }

[features]
# guest
default = ["std"]
std = []

# host
host = ["std"]

# alloy
alloy = [
    "host",
    "alloy-primitives/k256",
    "dep:anyhow",
    "dep:alloy-consensus",
    "dep:alloy-eips",
    "dep:alloy-genesis",
    "dep:alloy-primitives",
    "dep:alloy-rpc-types-debug",
]
